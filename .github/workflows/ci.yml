name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: ruff check .
      - run: pytest
      # Run the stage notebooks in order; they overwrite data/processed and figures in the runner
      - run: jupyter nbconvert --to notebook --execute --output-dir "$RUNNER_TEMP/nb" code/02_clean.ipynb
      - run: jupyter nbconvert --to notebook --execute --output-dir "$RUNNER_TEMP/nb" code/03_features.ipynb
      - run: jupyter nbconvert --to notebook --execute --output-dir "$RUNNER_TEMP/nb" code/04_model.ipynb
      - run: jupyter nbconvert --to notebook --execute --output-dir "$RUNNER_TEMP/nb" code/05_figures.ipynb
      # Fail if a regenerated output differs from the committed file: every table fragment and the
      # three CSVs the paper relies on. PDFs and gp_summary.csv are left out: they can differ between machines.
      - run: git diff --exit-code -- 'figures/*.tex' figures/metrics.csv figures/lasso_cv.csv figures/segments_summary.csv

  # Compile paper/main.tex to check that the fragments parse. Uploads nothing.
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends latexmk texlive-latex-base texlive-latex-recommended
      - run: latexmk -pdf -interaction=nonstopmode -halt-on-error main.tex
        working-directory: paper
