name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: ruff check .
      - run: pytest
      # Run the stage notebooks in order; they overwrite data/processed and figures in the runner
      - run: jupyter nbconvert --to notebook --execute --output-dir "$RUNNER_TEMP/nb" code/02_clean.ipynb
      - run: jupyter nbconvert --to notebook --execute --output-dir "$RUNNER_TEMP/nb" code/03_features.ipynb
      - run: jupyter nbconvert --to notebook --execute --output-dir "$RUNNER_TEMP/nb" code/04_model.ipynb
      - run: jupyter nbconvert --to notebook --execute --output-dir "$RUNNER_TEMP/nb" code/05_figures.ipynb
      # Fail if the regenerated metrics differ from the committed file
      - run: git diff --exit-code figures/metrics.csv
